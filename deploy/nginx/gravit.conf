# Gravit ERP — nginx. Ставится в /etc/nginx/sites-available/gravit и включается
# ссылкой в sites-enabled (server-setup.sh делает это сам).
#
# HTTPS сюда не вписан: certbot --nginx добавит блок 443 и редирект сам,
# и при обновлении сертификата править этот файл не придётся.

# Лимиты на публичные адреса: у них нет пароля, и бот, перебирающий хэши
# страницы клиента или код планшета, занял бы все три PHP-процесса.
# 10 МБ зоны хватает на ~160 000 адресов.
limit_req_zone $binary_remote_addr zone=gravit_public:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=gravit_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name erp.gravit.kz;
    root /var/www/gravit/public;
    index index.php;

    client_max_body_size 12m;   # чеки и договоры до 10 МБ
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    access_log /var/log/nginx/gravit.access.log;
    error_log  /var/log/nginx/gravit.error.log warn;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Страница клиента по QR и планшет цеха: 30 запросов в минуту с адреса,
    # короткий всплеск без задержки. Планшетов в цеху 1–2, им хватает.
    location ~ ^/(track|shop) {
        limit_req zone=gravit_public burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Вход в панель: перебор паролей упирается сюда раньше, чем в PHP.
    location = /admin/login {
        limit_req zone=gravit_login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Сборка и шрифты — на год в кэш браузера: имена файлов содержат хэш.
    # Лог по статике выключен: он только пишет диск. Если файла на диске нет —
    # это подписанная ссылка на закрытый файл (/storage/receipts/…jpg), её
    # отдаёт Laravel, поэтому падаем в index.php, а не в 404.
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-gravit.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        # Ответ панели — 100–300 КБ HTML; буферы в памяти, чтобы nginx не писал
        # его во временный файл на диск.
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_hide_header X-Powered-By;
    }

    # Скрытые файлы (.env, .git) и служебные каталоги наружу не отдаются.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(storage/framework|storage/logs|storage/backups) { deny all; }
}
