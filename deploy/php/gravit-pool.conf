; Gravit ERP — пул PHP-FPM под сервер с 1 ГБ памяти.
; Ставится в /etc/php/8.5/fpm/pool.d/gravit.conf, штатный www.conf удаляется
; (server-setup.sh делает это сам). Отдельный сокет, чтобы nginx не зависел
; от имени версии PHP.

[gravit]
user = www-data
group = www-data

listen = /run/php/php-fpm-gravit.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Очередь на сокете: четвёртый и пятый запрос ждут, а не получают 502.
listen.backlog = 64

; static вместо dynamic: на 1 ГБ лучше знать заранее, сколько памяти займёт
; PHP, чем дать ему разрастись под нагрузкой. Три процесса × ~75 МБ.
pm = static
pm.max_children = 3
; Перезапуск процесса каждые 500 запросов — страховка от утечек памяти.
pm.max_requests = 500

; Запрос дольше минуты убивается: иначе один зависший процесс — треть сервера.
request_terminate_timeout = 60s
; Всё, что дольше 5 секунд, попадает в лог с трассой: видно, какая страница тормозит.
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm-gravit-slow.log

php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[max_execution_time] = 60
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/log/php-fpm-gravit-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Кэш путей: Laravel + Filament открывают тысячи файлов на запрос.
php_admin_value[realpath_cache_size] = 4096k
php_admin_value[realpath_cache_ttl] = 600

; Сессии в файлах чистит сам PHP по лотерее; Laravel хранит их в storage,
; поэтому системный gc отключаем, чтобы cron Debian не трогал чужой каталог.
php_admin_value[session.gc_probability] = 0
