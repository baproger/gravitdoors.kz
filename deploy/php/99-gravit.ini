; Gravit ERP — opcache под сервер с 1 ГБ памяти.
; Ставится в /etc/php/8.5/fpm/conf.d/99-gravit.ini: номер 99 — чтобы перекрыть
; штатный 10-opcache.ini (server-setup.sh кладёт файл сам).

opcache.enable = 1
opcache.enable_cli = 0
; 64 МБ хватает на Laravel + Filament + Livewire с запасом; общие для всех процессов.
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
; Код меняется только через deploy.sh, который перезагружает PHP-FPM,
; поэтому проверять файлы на изменение на каждом запросе не нужно.
opcache.validate_timestamps = 0
; Filament и Livewire читают атрибуты из комментариев — без этого они ломаются.
opcache.save_comments = 1
; JIT на панели даёт единицы процентов, а буфер берёт память.
opcache.jit = off
opcache.jit_buffer_size = 0
